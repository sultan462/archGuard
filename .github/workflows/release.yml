name: Release ArchGuard

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: archguard

          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: archguard

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: archguard.exe

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Python for analyzer tests
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run tests
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Check release executable
        run: ./target/${{ matrix.target }}/release/${{ matrix.binary }} --version

      - name: Package Linux and macOS binaries
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf "dist/archguard-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" archguard

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/archguard.exe" `
            -DestinationPath "dist/archguard-${{ matrix.target }}.zip"

      - name: Upload packaged binary
        uses: actions/upload-artifact@v7
        with:
          name: archguard-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all packaged binaries
        uses: actions/download-artifact@v8
        with:
          pattern: archguard-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum archguard-*.tar.gz archguard-*.zip > SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/archguard-x86_64-unknown-linux-gnu.tar.gz
            dist/archguard-x86_64-apple-darwin.tar.gz
            dist/archguard-x86_64-pc-windows-msvc.zip
            dist/SHA256SUMS